# Cluster du projet NBA
#   - HDFS (hadoop) : data lake, stockage des fichiers bruts et nettoyes
#   - Spark : traitement des 13M lignes de play-by-play
#   - PostgreSQL : base relationnelle (equipes, joueurs, matchs, predictions) pour le dashboard
#   - Kafka : simulation du flux d'actions en temps reel (rejeu des matchs)
# lancer avec : docker compose up -d

services:

  # ---------- HADOOP / HDFS ----------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    ports:
      - "9871:9870"   # interface web HDFS (9871 car 9870 deja pris par un autre projet sur mon pc)
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./data:/donnees          # les CSV kaggle sont visibles ici dans le conteneur
    environment:
      - CLUSTER_NAME=nba
    env_file:
      - ./hadoop.env

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop.env

  # ---------- SPARK ----------
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    ports:
      - "8080:8080"   # interface web spark
      - "7077:7077"
    volumes:
      - ./spark/jobs:/jobs

  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./spark/jobs:/jobs
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=6g
      - SPARK_WORKER_CORES=4

  # ---------- POSTGRESQL ----------
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------- KAFKA (flux temps reel) ----------
  # un seul broker en mode KRaft (pas besoin de zookeeper)
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNE://:29092,EXTERNE://:9092,CONTROLLER://:9093
      # INTERNE = depuis les autres conteneurs (kafka:29092), EXTERNE = depuis le pc (localhost:9092)
      KAFKA_ADVERTISED_LISTENERS: INTERNE://kafka:29092,EXTERNE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNE:PLAINTEXT,EXTERNE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ---------- APPLICATION (a lancer quand le modele est entraine) ----------
  # docker compose --profile app up -d --build
  prediction:
    build:
      context: .
      dockerfile: temps_reel/Dockerfile
    profiles: ["app"]
    depends_on:
      - kafka
      - postgres

  dashboard:
    build: ./dashboard
    profiles: ["app"]
    ports:
      - "3000:3000"
    environment:
      PG_HOST: postgres
      KAFKA: kafka:29092
    depends_on:
      - kafka
      - postgres
      - prediction

volumes:
  hadoop_namenode:
  hadoop_datanode:
  postgres_data:
